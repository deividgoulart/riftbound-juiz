# ===========================================================================
# Gabarito v2 (etapa 7): perguntas reais do app, definições, continuações e mais fora do escopo
# ===========================================================================

# ---------------------------------------------------------------------------
# Perguntas reais (feitas no app durante os testes; origem: real)
# ---------------------------------------------------------------------------
- id: q29
  pergunta: "cartas que possuem habilidades podem ser respondidas por reactions?"
  categoria: regra_geral
  estilo: informal
  origem: real
  # "Sim, em geral, com exceção" também pode começar com "Depende" (ajuste da etapa 7).
  conclusao: ["sim", "depende"]
  resposta_esperada: >-
    Sim, em geral. Habilidades desencadeadas e ativadas usam a Chain e viram itens finalizados;
    quando não há mais itens pendentes, os jogadores recebem prioridade e podem jogar Reactions
    antes de a habilidade resolver. A exceção são as habilidades que usam [Add] (que geram
    recursos): elas resolvem imediatamente, sem passar a prioridade.
  fontes_esperadas: [faq/general-rules/abilities#ability-reactions]
  regras_esperadas: ["337.4", "406.4", "429.2"]

- id: q30
  pergunta: "spells que não são action nem reaction só podem ser usadas no meu turno?"
  categoria: so_crd
  estilo: informal
  origem: real
  conclusao: "sim"
  resposta_esperada: >-
    Sim. Por padrão, uma carta só pode ser jogada no seu próprio turno, quando você tem a
    prioridade e o turno está em Neutral Open (sem showdown, sem combate e sem Chain). Action
    libera jogar durante showdowns em qualquer turno; Reaction libera jogar com uma Chain aberta
    (Closed State) em qualquer turno e ainda tem todas as permissões de Action.
  fontes_esperadas: []
  regras_esperadas: ["310.1.a", "806.1.c.1", "813.1.c.1", "813.1.b"]

- id: q31
  pergunta: "não posso jogar reactions livremente?"
  categoria: so_crd
  estilo: informal
  origem: real
  resposta_esperada: >-
    Quase. Uma carta com Reaction pode ser jogada durante Closed States (quando existe uma Chain)
    em qualquer turno, e também tem as permissões de Action (showdowns em qualquer turno). Mas é
    preciso ter a prioridade (ou o Focus, num showdown) naquele momento: não dá pra jogar a
    qualquer instante sem ter a vez.
  fontes_esperadas: []
  regras_esperadas: ["813.1.b", "813.1.c.1", "338.1.a.2"]

- id: q32
  pergunta: "sempre quem ataca no showdown é quem tem a prioridade?"
  categoria: so_crd
  estilo: informal
  origem: real
  conclusao: "não"
  resposta_esperada: >-
    Não sempre. Quando o showdown começa, quem contestou o battlefield (normalmente quem moveu
    unidades pra lá) ganha o Focus, e quem tem o Focus recebe a prioridade. Depois, cada vez que
    uma Chain termina de resolver, o Focus passa para o próximo jogador.
  fontes_esperadas: []
  regras_esperadas: ["345", "335.1", "346"]

- id: q33
  pergunta: "se eu inicio um showdown com uma unidade que tem uma habilidade que ativa quando ataca o meu foco passa pro meu adversário diretamente?"
  categoria: so_crd
  estilo: informal
  origem: real
  conclusao: "não"
  resposta_esperada: >-
    Não. Quem contestou o battlefield começa com o Focus. As habilidades de ataque são
    desencadeadas e abrem a Chain do combate; quando uma Chain aberta por habilidade
    desencadeada termina de resolver, o Focus não passa. Você continua com o Focus.
  fontes_esperadas: []
  regras_esperadas: ["345", "346.1"]

- id: q34
  pergunta: "se eu jogo uma spell, meu oponente passa, eu tenho que passar tambem pra resolver a chain?"
  categoria: so_crd
  estilo: informal
  origem: real
  conclusao: "não"
  resposta_esperada: >-
    Não precisa passar de novo. Depois que a sua spell é finalizada, é você quem recebe a
    prioridade primeiro; quando você passa, a prioridade vai para o oponente. Se ele também passa,
    todos passaram em sequência sem acrescentar nada, e o item mais novo da Chain (a sua spell)
    resolve.
  fontes_esperadas: []
  regras_esperadas: ["337.4", "338.1.b.1", "339.1", "340.1"]

# ---------------------------------------------------------------------------
# Continuações de conversa (a pergunta só faz sentido com o histórico)
# ---------------------------------------------------------------------------
- id: q35
  pergunta: "e se ele responder com uma reaction, o que acontece?"
  categoria: continuacao
  estilo: informal
  historico:
    - pergunta: "se eu jogo uma spell, meu oponente passa, eu tenho que passar tambem pra resolver a chain?"
      resposta: >-
        Não. Depois que a sua spell é finalizada, você recebe a prioridade primeiro e passa;
        quando o oponente também passa, todos passaram em sequência e a spell resolve.
  resposta_esperada: >-
    A Reaction dele entra na Chain por cima da sua spell. Depois que ela é finalizada, se todos
    passarem a prioridade em sequência, a Reaction dele (o item mais novo) resolve primeiro. Como
    a sua spell ainda está na Chain, o controlador do item mais novo que restou (você) recebe a
    prioridade de novo e pode reagir; quando todos passarem outra vez, a sua spell resolve.
  fontes_esperadas:
    - faq/general-rules/chain-and-priority#partial-chain-reactions
    - faq/general-rules/chain-and-priority#pending-item-order
  regras_esperadas: ["340.1", "340.4", "338.1.a.2"]

- id: q36
  pergunta: "e quem começa com o foco?"
  categoria: continuacao
  estilo: informal
  historico:
    - pergunta: "como funciona o showdown?"
      resposta: >-
        Um showdown é uma janela em que os jogadores se alternam jogando cartas e ativando
        habilidades com Action ou Reaction, cada um na sua vez (o Focus). Ele acaba quando todos
        passam em sequência sem fazer nada.
  resposta_esperada: >-
    Quem contestou o battlefield (em geral, quem moveu unidades para lá) começa com o Focus.
    Depois, a cada Chain que termina de resolver, o Focus passa para o próximo jogador, exceto
    quando a Chain foi aberta por uma habilidade desencadeada.
  fontes_esperadas: []
  regras_esperadas: ["345", "346", "346.1"]

# ---------------------------------------------------------------------------
# Definições (perguntas de iniciante: "o que é", "explique")
# ---------------------------------------------------------------------------
- id: q37
  pergunta: "o que é open state?"
  categoria: definicao
  estilo: informal
  origem: real
  resposta_esperada: >-
    É o estado do turno em que não existe nenhuma Chain. Quando uma carta é jogada ou uma
    habilidade é ativada, abre-se uma Chain e o turno passa para Closed State; quando a Chain
    esvazia, volta a Open State. Por padrão, com a Chain aberta só dá pra jogar cartas com Reaction.
  fontes_esperadas: []
  regras_esperadas: ["309.1", "309.2", "331.1.a"]

- id: q38
  pergunta: "o que é priority?"
  categoria: definicao
  estilo: formal
  resposta_esperada: >-
    Priority é o direito exclusivo de agir naquele momento (jogar uma carta ou ativar uma
    habilidade que o timing permita). Quando os jogadores podem responder antes de um spell ou
    habilidade fazer efeito, quem tem a prioridade pode jogar uma Reaction ou passar a vez para o
    próximo jogador.
  fontes_esperadas: [faq/glossario#priority]
  regras_esperadas: ["312.1"]

- id: q39
  pergunta: "o que significa focus?"
  categoria: definicao
  estilo: informal
  resposta_esperada: >-
    Durante um showdown, o Focus marca o jogador que tem a vez de começar uma sequência (jogar
    uma carta ou ativar uma habilidade permitida). Normalmente o Focus passa para o próximo
    jogador depois que essa sequência termina; se todos passarem o Focus em sequência sem fazer
    nada, o showdown acaba.
  fontes_esperadas: [faq/glossario#focus]
  regras_esperadas: ["313.1", "347.2.a"]

- id: q40
  pergunta: "me explique as chains"
  categoria: definicao
  estilo: informal
  origem: real
  resposta_esperada: >-
    A Chain é a área temporária onde cartas e habilidades esperam enquanto são jogadas; é nela
    que os jogadores podem responder com Reactions antes que o efeito aconteça. Os itens
    pendentes são finalizados do mais antigo para o mais novo; depois, quando todos passam a
    prioridade em sequência, o item finalizado mais novo resolve primeiro. Unidades, gear e
    habilidades de [Add] resolvem assim que são finalizados.
  fontes_esperadas:
    - faq/glossario#chain
    - faq/general-rules/chain-and-priority#pending-item-order
  regras_esperadas: ["328", "337.1.b", "340.1"]

- id: q41
  pergunta: "como eu sei quando entra em Closed State"
  categoria: definicao
  estilo: informal
  origem: real
  resposta_esperada: >-
    O turno entra em Closed State sempre que existe uma Chain, ou seja, assim que uma carta
    começa a ser jogada ou uma habilidade é ativada e vai para a Chain. Enquanto a Chain existir,
    por padrão só dá pra jogar cartas e ativar habilidades com Reaction. Quando a Chain esvazia,
    o turno volta a Open State.
  fontes_esperadas: []
  regras_esperadas: ["309.1", "328", "331.1.a", "340.2"]

- id: q42
  pergunta: "o que é Deathknell?"
  categoria: definicao
  estilo: formal
  resposta_esperada: >-
    Deathknell é uma palavra-chave de habilidade desencadeada, presente em permanentes. Funciona
    como "Quando eu morrer, [efeito]": a habilidade vai para a Chain quando a unidade morre.
  fontes_esperadas: [faq/mechanics/deathknell#trigger-timing]
  regras_esperadas: ["808.1.c"]

