# Publica a API no Hugging Face Spaces a cada mudança no main (veja "Como publicar" no README).
# Precisa, nas configurações do repositório no GitHub (Settings > Secrets and variables > Actions):
#   - secret HF_TOKEN: token do Hugging Face com permissão de escrita (huggingface.co/settings/tokens)
#   - variável HF_SPACE: o Space, ex.: deividgoulart/juiz-riftbound
# Sem os dois, o passo de publicar é pulado.
name: API no Hugging Face

on:
  push:
    branches: [main]
    paths: ["api/**", "juiz/**", "decks/**", "data/vetores/**", "requirements.txt", "Dockerfile", ".dockerignore",
            ".github/workflows/api-huggingface.yml"]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar a pasta do Space
        run: |
          mkdir espaco
          cp -r api juiz decks requirements.txt Dockerfile .dockerignore LICENSE espaco/
          mkdir -p espaco/data/raw espaco/data/processed espaco/avaliacao
          cp -r data/vetores espaco/data/
          cp avaliacao/gabarito.yaml espaco/avaliacao/ 2>/dev/null || true
          find espaco -name __pycache__ -prune -exec rm -rf {} +
          # O Space lê a configuração do cabeçalho do README.
          cat > espaco/README.md <<'FIM'
          ---
          title: Juiz Riftbound API
          emoji: ⚖️
          colorFrom: yellow
          colorTo: blue
          sdk: docker
          app_port: 7860
          pinned: false
          license: mit
          ---

          API do [Juiz Riftbound](https://github.com/${{ github.repository }}): juiz de regras e deck builder de Riftbound TCG.
          Publicada automaticamente pelo GitHub Actions; a documentação das rotas fica em `/docs`.
          FIM
      - name: Enviar pro Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install --quiet "huggingface_hub>=0.34"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path="espaco", repo_id=os.environ["HF_SPACE"], repo_type="space",
              delete_patterns="*", commit_message=f"GitHub {os.environ['GITHUB_SHA'][:7]}")
          PY
