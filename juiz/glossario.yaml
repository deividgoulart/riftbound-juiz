# Glossário português -> inglês dos termos de Riftbound (etapa 5).
#
# Pra que serve:
#   1. Busca: quando a pergunta usa um termo em português ("atordoar"), o termo oficial
#      em inglês ("Stun") é acrescentado à pergunta antes de buscar.
#   2. Resposta: o LLM recebe a lista dos termos encontrados e responde com o termo oficial
#      em inglês, que é o que está escrito nas cartas e nas regras.
#
# Formato: cada item tem o termo oficial em inglês (en) e as formas em português (pt).
#   - Maiúsculas e acentos não importam ("Confronto" = "confronto" = "confrontó").
#   - Um "*" no fim aceita qualquer terminação: "atordo*" pega atordoar, atordoa, atordoado...
#   - Os termos em inglês vêm do Core Rules 1.4 e das palavras-chave do FAQ.
#   - As traduções não são oficiais: são como os jogadores costumam falar. Ajuste à vontade.
#   - Ficaram de fora palavras comuns demais pra identificar um termo sem erro, como "poder"
#     (verbo), "ordem" ("ordem de turno"), "mente" e "corpo".

